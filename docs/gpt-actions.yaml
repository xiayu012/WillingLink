openapi: "3.1.0"
info:
  title: WillingLink Rental GPT Actions API
  description: >
    Actions API for the WillingLink Custom GPT. It mirrors the in-app AI chat
    rental assistant: database stats, read-only SQL exploration, semantic rental
    search with progressive relaxation, listing details, and public transit tools.
  version: "2.0.0"

servers:
  - url: https://willinglink.vercel.app
    description: Production

security:
  - BearerAuth: []

paths:
  /api/gpt/stats:
    get:
      operationId: getStats
      summary: Get database overview statistics
      description: >
        Use this when the user asks about inventory, cities, rent ranges, bedroom
        distribution, or before a complex search to understand what data exists.
      responses:
        "200":
          description: Database statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/gpt/query:
    post:
      operationId: queryListings
      summary: Run a read-only SQL SELECT query against XhsRentalListing
      description: >
        Read-only SELECT on "XhsRentalListing". Use rentNumeric, bedroomsNum,
        city. On SQL error, fix using returned hint and retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query results or structured SQL error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/gpt/search:
    post:
      operationId: searchListings
      summary: Search rental listings by natural language and structured filters
      description: >
        Search listings by natural language and filters. Supports mustNotContain
        and excludeIds. Returns action (SHOW_LISTING, SHOW_RELAXED_LISTING,
        NO_MORE, NO_RESULTS). Follow action exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results plus action protocol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gpt/listings/{id}:
    get:
      operationId: getListing
      summary: Get full details of a single listing by ID
      description: >
        Use this after searchListings when the user asks for details,
        contact info, the full post, original link, images, or is interested in
        a specific listing.
      parameters:
        - name: id
          in: path
          required: true
          description: Listing UUID from a searchListings result
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full listing details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gpt/find-nearest-transit:
    post:
      operationId: findNearestTransit
      summary: Find the listing with the shortest public transit commute
      description: >
        Use this when the user gives their address or area and asks which
        listing is closest, fastest by transit, or most convenient for commuting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindNearestTransitRequest"
      responses:
        "200":
          description: Best listing and transit candidates, or a structured maps error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindNearestTransitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gpt/transit-time:
    post:
      operationId: getTransitTime
      summary: Calculate public transit time to a specific listing
      description: >
        Use this after a listing has been shown and the user asks how long the
        commute is to that listing. Reuse the user's address from context if it
        was already provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitTimeRequest"
      responses:
        "200":
          description: Transit duration result or structured maps error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitTimeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Static API key. Configure Custom GPT authentication as Bearer token.

  schemas:
    QueryRequest:
      type: object
      required:
        - sqlQuery
      properties:
        sqlQuery:
          type: string
          description: >
            PostgreSQL SELECT query against "XhsRentalListing". Must start with
            SELECT and include LIMIT when returning rows. Example:
            SELECT city, COUNT(*) AS cnt FROM "XhsRentalListing" WHERE city IS NOT NULL GROUP BY city ORDER BY cnt DESC LIMIT 20

    QueryResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        rowCount:
          type: integer
        error:
          type: string
        attemptedQuery:
          type: string
        hint:
          type: string

    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: >
            Full natural-language search intent. Include all context from the
            conversation: location, budget, bedrooms, move-in date, special
            requirements, hard negatives, commute target, etc.
          example: "2 bedroom in Sunnyvale under $2500 pet friendly with parking"
        city:
          type: string
          nullable: true
          description: Exact standardized English city name, e.g. San Jose, Sunnyvale, Fremont.
        rentMin:
          type: integer
          nullable: true
          description: Minimum monthly rent in USD.
        rentMax:
          type: integer
          nullable: true
          description: Maximum monthly rent in USD.
        bedroomsNum:
          type: integer
          nullable: true
          description: Exact bedroom count. Studio is 0.
        petFriendly:
          type: boolean
          nullable: true
          description: true for pet-friendly listings. Omit if user did not mention pets.
        couplesOk:
          type: boolean
          nullable: true
          description: true when the user is a couple or two people moving in.
        utilitiesIncluded:
          type: boolean
          nullable: true
          description: true when user requires utilities included.
        parkingIncluded:
          type: boolean
          nullable: true
          description: true when user requires parking.
        furnished:
          type: string
          nullable: true
          enum: [furnished, unfurnished, partial]
        mustNotContain:
          type: array
          nullable: true
          description: >
            Hard negative terms. Listings containing any term in title/rawText/location/property
            are disqualified. Keep this across turns. Include Chinese and English variants.
          items:
            type: string
          example: ["限一人", "one person only", "中介费", "broker fee"]
        excludeIds:
          type: array
          nullable: true
          description: >
            Listing ids already shown in this conversation. Use when user says
            换一个 / next / 不满意 / 还有吗.
          items:
            type: string
            format: uuid
        limit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          default: 5

    SearchResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/ListingSummary"
        count:
          type: integer
        totalBeforeFilter:
          type: integer
        totalAfterFilter:
          type: integer
        action:
          type: string
          enum: [SHOW_LISTING, SHOW_RELAXED_LISTING, NO_MORE, NO_RESULTS, SEARCH_FAILED]
          description: Follow this action protocol exactly in the GPT response.
        relaxedNote:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    ListingSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceUrl:
          type: string
        title:
          type: string
          nullable: true
        rent:
          type: string
          nullable: true
        rentNumeric:
          type: integer
          nullable: true
        deposit:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        locationText:
          type: string
          nullable: true
        propertyName:
          type: string
          nullable: true
        bedrooms:
          type: string
          nullable: true
        bedroomsNum:
          type: integer
          nullable: true
        bathrooms:
          type: string
          nullable: true
        roomType:
          type: string
          nullable: true
        listingType:
          type: string
          nullable: true
        furnished:
          type: string
          nullable: true
        availableFrom:
          type: string
          nullable: true
        leaseEndDate:
          type: string
          nullable: true
        contactMethod:
          type: string
          nullable: true
        petFriendly:
          type: boolean
          nullable: true
        couplesOk:
          type: boolean
          nullable: true
        utilitiesIncluded:
          type: boolean
          nullable: true
        parkingIncluded:
          type: boolean
          nullable: true
        imageUrls:
          type: array
          nullable: true
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        rawTextExcerpt:
          type: string

    FullListing:
      allOf:
        - $ref: "#/components/schemas/ListingSummary"
        - type: object
          properties:
            rawText:
              type: string
            postedAt:
              type: string
              format: date-time
              nullable: true

    FindNearestTransitRequest:
      type: object
      required:
        - userAddress
      properties:
        userAddress:
          type: string
          description: User's address or area, e.g. "123 Main St, Mountain View" or "三藩市 10th Ave".

    TransitTimeRequest:
      type: object
      required:
        - userAddress
        - listingAddress
      properties:
        userAddress:
          type: string
        listingAddress:
          type: string
          description: Listing locationText/propertyName from prior search results.
        listingTitle:
          type: string
          nullable: true

    TransitCandidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        locationText:
          type: string
          nullable: true
        propertyName:
          type: string
          nullable: true
        rent:
          type: string
          nullable: true
        roomType:
          type: string
          nullable: true
        bedrooms:
          type: string
          nullable: true
        sourceUrl:
          type: string
        transitMinutes:
          type: integer
        transitDurationText:
          type: string
        distanceKm:
          type: number

    FindNearestTransitResponse:
      type: object
      properties:
        userResolvedAddress:
          type: string
        bestListing:
          type: object
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
              nullable: true
            locationText:
              type: string
              nullable: true
            propertyName:
              type: string
              nullable: true
            rent:
              type: string
              nullable: true
            roomType:
              type: string
              nullable: true
            bedrooms:
              type: string
              nullable: true
            sourceUrl:
              type: string
        transitMinutes:
          type: integer
        transitDurationText:
          type: string
        allCandidates:
          type: array
          items:
            $ref: "#/components/schemas/TransitCandidate"
        error:
          type: string
          description: Error code when maps lookup fails
        message:
          type: string
          description: Human-readable error message

    TransitTimeResponse:
      type: object
      properties:
        originFormatted:
          type: string
        destinationFormatted:
          type: string
        listingTitle:
          type: string
          nullable: true
        transitMinutes:
          type: integer
        transitDurationText:
          type: string
        error:
          type: string
          description: Error code when maps lookup fails
        message:
          type: string
          description: Human-readable error message

    StatsResponse:
      type: object
      properties:
        totalListings:
          type: integer
        byCity:
          type: array
          items:
            type: object
            properties:
              city:
                type: string
              count:
                type: integer
        rentStats:
          type: object
          properties:
            min:
              type: integer
              nullable: true
            max:
              type: integer
              nullable: true
            median:
              type: integer
              nullable: true
            p25:
              type: integer
              nullable: true
            p75:
              type: integer
              nullable: true
            currency:
              type: string
        byBedroomsNum:
          type: array
          items:
            type: object
            properties:
              bedroomsNum:
                type: integer
              label:
                type: string
              count:
                type: integer
        features:
          type: object
          properties:
            petFriendly:
              type: integer
            couplesOk:
              type: integer
            utilitiesIncluded:
              type: integer
            parkingIncluded:
              type: integer

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Listing not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    ServiceUnavailable:
      description: API key environment variable not configured
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              detail:
                type: string
