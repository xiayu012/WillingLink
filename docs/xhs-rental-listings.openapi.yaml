openapi: 3.0.0
info:
  title: Rental API (XhsRentalListing)
  description: |
    只读查询 Postgres 表 **XhsRentalListing**（小红书租房帖上报数据）。
    生产路径为 `/api/xhs/rental-listings`。若部署环境设置了 `XHS_RENTAL_LISTINGS_READ_SECRET`，
    则须在请求头携带 `Authorization: Bearer <同一密钥>`；未设置时可以不带头。
  version: 1.0.0

servers:
  - url: https://willinglink.vercel.app
    description: 生产（Vercel）

tags:
  - name: XhsRentalListing
    description: 租房列表（表名 XhsRentalListing）

paths:
  /api/xhs/rental-listings:
    get:
      tags:
        - XhsRentalListing
      summary: 查询 / 搜索租房列表（分页）
      description: |
        返回表 **XhsRentalListing** 的全字段行，按 `createdAt` 新到旧排序。
        可选查询参数 `q` 在 `title`、`rawText`、`locationText`、`propertyName` 上做不区分大小写的包含匹配；
        参数中的 `%`、`_` 会被去掉（避免 ILIKE 通配符注入）。
      operationId: searchRentalListings
      parameters:
        - name: limit
          in: query
          description: 每页条数，默认 100，最大 500
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: 跳过条数，默认 0，最大 500000
          schema:
            type: integer
            minimum: 0
            maximum: 500000
            default: 0
        - name: q
          in: query
          description: 关键词（可选），多字段 OR 包含匹配
          schema:
            type: string
            maxLength: 500
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalListingsPage"
        "401":
          description: 未授权（已配置 `XHS_RENTAL_LISTINGS_READ_SECRET` 但 Bearer 不正确或缺失）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    options:
      tags:
        - XhsRentalListing
      summary: CORS 预检
      operationId: corsRentalListings
      responses:
        "204":
          description: 无内容

components:
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
      required:
        - error

    XhsRentalListing:
      type: object
      description: 与数据库表 XhsRentalListing 列一致
      properties:
        id:
          type: string
          format: uuid
        sourceUrl:
          type: string
          description: 来源链接
        title:
          type: string
          nullable: true
        rawText:
          type: string
          description: 原始正文
        rent:
          type: string
          nullable: true
        deposit:
          type: string
          nullable: true
        availableFrom:
          type: string
          nullable: true
        leaseEndDate:
          type: string
          nullable: true
        listingType:
          type: string
          nullable: true
        bedrooms:
          type: string
          nullable: true
        bathrooms:
          type: string
          nullable: true
        roomType:
          type: string
          nullable: true
        propertyName:
          type: string
          nullable: true
        locationText:
          type: string
          nullable: true
        furnished:
          type: string
          nullable: true
        contactMethod:
          type: string
          nullable: true
        imageUrls:
          type: array
          nullable: true
          items:
            type: string
            format: uri
          description: Blob 公开 URL 列表
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sourceUrl
        - rawText
        - createdAt

    RentalListingsPage:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/XhsRentalListing"
        total:
          type: integer
          description: 满足当前筛选条件的总条数
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: 是否还有下一页（offset + len(listings) < total）
      required:
        - listings
        - total
        - limit
        - offset
        - hasMore

  securitySchemes:
    RentalReadBearer:
      type: http
      scheme: bearer
      description: |
        与部署环境变量 `XHS_RENTAL_LISTINGS_READ_SECRET` 相同值；
        仅在该变量已设置时生效，格式：`Authorization: Bearer <secret>`
